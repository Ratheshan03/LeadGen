# =============================================================================
#  LeadGen - business types to crawl
# =============================================================================
#  When you crawl with type "ALL", every type listed below is searched, one
#  after another, in each area. Each type costs roughly 1-3 Google requests per
#  tile (more in busy city centres), so a shorter list = cheaper crawls.
#
#  How to edit:
#   * Remove a line (or put a # in front of it) to stop crawling that type.
#   * Add a new line "- some_type" under any category to crawl it.
#     Use Google Place types, e.g. "plumber", "car_wash", "florist".
#     Full list: https://developers.google.com/maps/documentation/places/web-service/place-types
#   * Categories are only for grouping in the dashboard; rename them freely.
#   * Keep the two-space indent and the "- " in front of each type.
#
#  Restart the backend after editing this file.
# =============================================================================

